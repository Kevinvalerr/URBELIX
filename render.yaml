# Blueprint de Render para URBELIX.
# La base MySQL se gestiona en Aiven, fuera de Render: este blueprint declara
# solo el servicio web y espera las credenciales como variables de entorno
# (sync: false = se cargan a mano en el dashboard, no se versionan).
services:
  - type: web
    name: urbelix
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    autoDeployTrigger: commit
    envVars:
      # Activa src/main/resources/application-prod.properties.
      # "prod,demo" en el primer despliegue: siembra el administrador inicial,
      # sin el cual no hay forma de entrar en una base vacia. Cuando ya existan
      # usuarios reales, cambiar a "prod" a secas.
      - key: SPRING_PROFILES_ACTIVE
        value: prod,demo

      # --- Semilla inicial (solo se usan con el perfil demo) ---
      - key: DEMO_ADMIN_EMAIL
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_RESIDENTE_PASSWORD
        sync: false

      # --- Aiven for MySQL ---
      # Usar la URL JDBC completa de Aiven, incluyendo sslMode=REQUIRED.
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # URL publica del servicio, usada en los correos a residentes.
      # Ej: https://urbelix.onrender.com/login
      - key: APP_BASE_URL
        sync: false

      # --- SMTP (opcional; sin esto las notificaciones quedan inactivas) ---
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

      # --- Ejecucion ---
      # 512 MB en el plan free: se limita el heap y se usa GC serie.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=65 -XX:+UseSerialGC"
