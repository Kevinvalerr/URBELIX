# Perfil de produccion (Aiven for MySQL).
# Activar con SPRING_PROFILES_ACTIVE=prod
# Todas las credenciales llegan por variables de entorno: no se versiona ningun secreto.

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Aiven cierra las conexiones ociosas: mantener el pool por debajo de ese limite.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.connection-timeout=30000

# El esquema lo administra Flyway; Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
# En una base vacia Flyway aplica la cadena versionada completa desde cero.
spring.flyway.baseline-on-migrate=false

# devtools no debe activarse en produccion.
spring.devtools.restart.enabled=false

server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-stacktrace=never

urbelix.fastapi.url=${FASTAPI_URL:http://localhost:8000}

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN

# URL publica del portal, usada en los correos que se envian a los residentes.
urbelix.portal.url=${PORTAL_URL:http://localhost:8080/login}
