# Perfil de desarrollo local
spring.datasource.url=jdbc:h2:file:./data/nexurdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
app.seed-data.enabled=true
app.admin.email=${DEV_ADMIN_EMAIL:admin@nexur.com}
app.admin.password=${DEV_ADMIN_PASSWORD:Admin123!}
app.porteria.password=${DEV_PORTERIA_PASSWORD:Porteria123!}
app.payments.simulation-enabled=${PAYMENTS_SIMULATION_ENABLED:true}
app.payments.simulation-secret=${PAYMENTS_SIMULATION_SECRET:urbelix-dev-simulation-secret}
# Las sesiones locales no deben sobrevivir al reinicio ni a cambios de version.
server.servlet.session.persistent=false
