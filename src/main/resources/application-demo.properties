# Perfil de demostracion. Se combina con el perfil de despliegue:
#   SPRING_PROFILES_ACTIVE=prod,demo
# Activa DemoDataInitializer, que siembra un conjunto residencial completo
# la primera vez que arranca sobre una base de datos vacia.

# Sin valor por defecto a proposito: la aplicacion no arranca si faltan.
urbelix.demo.admin-email=${DEMO_ADMIN_EMAIL:admin@urbelix.demo}
urbelix.demo.admin-password=${DEMO_ADMIN_PASSWORD:}
urbelix.demo.residente-password=${DEMO_RESIDENTE_PASSWORD:}
