spring.application.name=Nexur
# Arranque local seguro con H2; en produccion activar explicitamente el perfil prod.
spring.profiles.default=dev
# Configuracion MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexur_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.flyway.enabled=false

# Recuperacion de contrasena
app.base-url=${APP_BASE_URL:http://localhost:8080}
urbelix.fastapi.url=${URBELIX_FASTAPI_URL:http://127.0.0.1:8000}
app.reports.fastapi-enabled=${REPORTS_FASTAPI_ENABLED:false}
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
app.administration.amount=${ADMINISTRATION_AMOUNT:300000}
app.upload-dir=${UPLOAD_DIR:./data/uploads}
app.notifications.email-enabled=${NOTIFICATIONS_EMAIL_ENABLED:false}
app.pse.webhook-secret=${PSE_WEBHOOK_SECRET:}

# Wompi: las llaves privadas y secretos solo se leen desde variables de entorno.
wompi.base-url=${WOMPI_BASE_URL:https://sandbox.wompi.co/v1/}
wompi.public-key=${WOMPI_PUBLIC_KEY:}
wompi.private-key=${WOMPI_PRIVATE_KEY:}
wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET:}
wompi.events-secret=${WOMPI_EVENTS_SECRET:}
app.payments.simulation-enabled=${PAYMENTS_SIMULATION_ENABLED:false}
app.payments.simulation-secret=${PAYMENTS_SIMULATION_SECRET:}

# Evidencias de PQRS: se almacenan fuera de los recursos publicos.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# SMTP: obligatorio para enviar recuperaciones reales de contrasena.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
