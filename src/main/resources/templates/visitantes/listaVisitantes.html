<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout/base :: page}">
<div th:fragment="content">
    <section class="page-top-section mb-4">
        <div>
            <h1 th:text="${esResidente ? 'Mis solicitudes de visitantes' : 'Control de visitantes'}">Control de visitantes</h1>
            <p class="text-muted" th:text="${esResidente ? 'Solicita accesos y consulta el estado de tus visitantes.' : 'Revisa solicitudes y registra los accesos autorizados.'}">Gestiona el acceso de visitantes.</p>
        </div>
        <div class="page-actions" sec:authorize="hasRole('RESIDENTE')">
            <a th:href="@{/visitantes/nuevo}" class="btn btn-primary"><i class="bi bi-person-plus me-2"></i>Solicitar visitante</a>
        </div>
    </section>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row g-3 mb-4 toolbar-filter">
        <div class="col-md-8"><input class="form-control" data-filter-search="visitantes" oninput="filterRows('visitantes')" placeholder="Buscar por nombre, documento o apartamento"></div>
        <div class="col-md-4"><select class="form-select" data-filter-status="visitantes" onchange="filterRows('visitantes')"><option value="ALL">Todos los estados</option><option value="PENDIENTE">Pendientes</option><option value="APROBADA">Aprobadas</option><option value="RECHAZADA">Rechazadas</option><option value="DENTRO">Dentro</option><option value="FINALIZADA">Finalizadas</option></select></div>
    </div>

    <div class="timeline-container table-surface">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead><tr><th>Visitante</th><th>Documento</th><th>Apartamento</th><th>Estado</th><th>Entrada</th><th>Salida</th><th sec:authorize="hasRole('PORTERIA')">Acciones</th></tr></thead>
                <tbody>
                <tr th:each="visitante : ${visitantes}" data-filter-row="visitantes" th:attr="data-status=${visitante.estado != null ? visitante.estado.name() : 'PENDIENTE'}">
                    <td><strong th:text="${visitante.nombre}">Visitante</strong><div th:if="${visitante.motivoRechazo}" class="small text-danger" th:text="${visitante.motivoRechazo}"></div></td>
                    <td th:text="${visitante.documento}">00000000</td>
                    <td th:text="${visitante.apartamento != null ? visitante.apartamento.numero : 'Sin apartamento'}">101</td>
                    <td>
                        <span th:if="${visitante.estado != null and visitante.estado.name() == 'PENDIENTE'}" class="badge text-bg-warning">Pendiente</span>
                        <span th:if="${visitante.estado != null and visitante.estado.name() == 'APROBADA'}" class="badge text-bg-primary">Aprobada</span>
                        <span th:if="${visitante.estado != null and visitante.estado.name() == 'RECHAZADA'}" class="badge text-bg-danger">Rechazada</span>
                        <span th:if="${visitante.estado != null and visitante.estado.name() == 'DENTRO'}" class="badge text-bg-success">Dentro</span>
                        <span th:if="${visitante.estado != null and visitante.estado.name() == 'FINALIZADA'}" class="badge text-bg-secondary">Finalizada</span>
                    </td>
                    <td th:text="${visitante.fechaEntrada != null ? #temporals.format(visitante.fechaEntrada, 'dd/MM/yyyy HH:mm') : '-'}">-</td>
                    <td th:text="${visitante.fechaSalida != null ? #temporals.format(visitante.fechaSalida, 'dd/MM/yyyy HH:mm') : '-'}">-</td>
                    <td sec:authorize="hasRole('PORTERIA')">
                        <div th:if="${visitante.estado != null and visitante.estado.name() == 'PENDIENTE'}" class="d-flex gap-1 flex-wrap">
                            <form th:action="@{/visitantes/{id}/aprobar(id=${visitante.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"><button type="submit" class="btn btn-sm btn-outline-success">Aprobar</button></form>
                            <form th:action="@{/visitantes/{id}/rechazar(id=${visitante.id})}" method="post" class="d-flex gap-1"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"><input name="motivo" class="form-control form-control-sm" maxlength="500" placeholder="Motivo" required><button type="submit" class="btn btn-sm btn-outline-danger">Rechazar</button></form>
                        </div>
                        <form th:if="${visitante.estado != null and visitante.estado.name() == 'APROBADA'}" th:action="@{/visitantes/{id}/entrada(id=${visitante.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"><button type="submit" class="btn btn-sm btn-outline-primary">Registrar entrada</button></form>
                        <form th:if="${visitante.estado != null and visitante.estado.name() == 'DENTRO'}" th:action="@{/visitantes/salida/{id}(id=${visitante.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"><button type="submit" class="btn btn-sm btn-outline-danger">Registrar salida</button></form>
                        <span th:if="${visitante.estado != null and (visitante.estado.name() == 'RECHAZADA' or visitante.estado.name() == 'FINALIZADA')}" class="text-muted small">Sin acciones</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(visitantes)}"><td colspan="7" class="text-center text-muted py-5">No hay solicitudes ni visitas para mostrar.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</html>
