<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: page}">
<div th:fragment="content">
    <section class="page-top-section">
        <div>
            <h1>Solicitar acceso de visitante</h1>
            <p class="text-muted">La solicitud quedará pendiente hasta que portería la revise y autorice.</p>
        </div>
    </section>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="card form-card">
        <div class="card-body">
            <form th:action="@{/visitantes/guardar}" th:object="${visitante}" method="post" class="form-grid js-validated-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">
                <div class="form-group">
                    <label class="form-label" for="nombre">Nombre del visitante</label>
                    <input id="nombre" type="text" th:field="*{nombre}" class="form-control" required maxlength="120" />
                    <p class="form-error error-message" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>
                </div>
                <div class="form-group">
                    <label class="form-label" for="documento">Documento</label>
                    <input id="documento" type="text" th:field="*{documento}" class="form-control" required maxlength="20" pattern="[0-9]{8,}" title="Solo números, mínimo 8 dígitos" inputmode="numeric" />
                    <p class="form-error error-message" th:if="${#fields.hasErrors('documento')}" th:errors="*{documento}"></p>
                </div>
                <div class="form-group form-full-width">
                    <label class="form-label">Apartamento de destino</label>
                    <div class="form-control bg-light" th:text="${apartamento != null ? apartamento.numero + ' - Torre ' + apartamento.torre : 'Sin apartamento asignado'}">Apartamento asignado</div>
                    <small class="text-muted">El apartamento se toma automáticamente de tu cuenta residencial.</small>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-main-action">Enviar solicitud</button>
                    <a th:href="@{/visitantes}" class="btn btn-outline-primary">Volver a mis solicitudes</a>
                </div>
            </form>
        </div>
    </div>
</div>
</html>
