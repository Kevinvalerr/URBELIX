<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: page}">
    <div th:fragment="content" th:with="titulo='Crear usuario | Urbelix'">
        <section class="page-top-section">
            <div>
                <h1>Crear usuario</h1>
                <p class="text-muted">Registra una nueva cuenta con credenciales seguras.</p>
            </div>
            <div class="page-actions">
                <a th:href="@{/usuarios}" class="btn btn-outline-primary">Volver a usuarios</a>
            </div>
        </section>

        <div class="card form-card">
            <div class="card-body">
                <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post" class="mt-3 form-grid">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">

                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                        <ul>
                            <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
                        </ul>
                    </div>
                    <div th:if="${formError}" class="alert alert-danger" th:text="${formError}"></div>

                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required />
                        <p class="error-message" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" th:field="*{email}" class="form-control" required autocomplete="email" title="Correo válido: usuario@dominio.com" />
                        <p class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" th:field="*{password}" class="form-control" required minlength="8" autocomplete="new-password"
                               title="Mínimo 8 caracteres, al menos una mayúscula, una minúscula, un número y un símbolo" />
                        <small class="text-muted">La contraseña debe tener al menos 8 caracteres, mayúscula, minúscula, número y símbolo.</small>
                        <p class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                    </div>

                    <div class="form-group">
                        <label>Confirmar contraseña</label>
                        <input type="password" name="confirmPassword" id="confirmPassword" class="form-control" required minlength="8" autocomplete="new-password" title="Repita la contraseña anterior" />
                    </div>

                    <div class="form-group">
                        <label>Rol</label>
                        <select th:field="*{rol}" id="rol" class="form-select" required>
                            <option value="RESIDENTE">Residente</option>
                            <option value="PORTERIA">Portería</option>
                            <option value="ADMIN">Administrador</option>
                        </select>
                    </div>

                    <div class="form-group residente-field">
                        <label>Documento</label>
                        <input type="text" name="documento" class="form-control" th:value="${documento}" required inputmode="numeric"
                               pattern="^[0-9]{8,}$"
                               title="Solo números, mínimo 8 dígitos" />
                    </div>

                    <div class="form-group residente-field">
                        <label>Teléfono</label>
                        <input type="tel" name="telefono" class="form-control" th:value="${telefono}" required inputmode="tel"
                               pattern="^[0-9]{10,}$"
                               title="Solo números, mínimo 10 dígitos" />
                    </div>

                    <div class="form-group residente-field">
                        <label>Apartamento</label>
                        <input type="text" name="numeroApartamento" id="numeroApartamento" th:value="${numeroApartamento}" class="form-control" required />
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-success">Crear usuario</button>
                    </div>
                </form>
                <script>
                    document.addEventListener('DOMContentLoaded', function () {
                        const rol = document.getElementById('rol');
                        const campos = document.querySelectorAll('.residente-field');
                        function actualizarCampos() {
                            const esResidente = rol.value === 'RESIDENTE';
                            campos.forEach(function (campo) {
                                campo.classList.toggle('d-none', !esResidente);
                                const input = campo.querySelector('input');
                                if (input) input.required = esResidente;
                            });
                        }
                        rol.addEventListener('change', actualizarCampos);
                        actualizarCampos();
                    });
                </script>
            </div>
        </div>
    </div>
</html>
