<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout/base :: page">
    <div th:fragment="content" th:with="titulo='Crear usuario | URBELIX'">
        <section class="page-top-section">
            <div>
                <h1>Crear usuario</h1>
                <p class="text-muted">Registra una nueva cuenta con credenciales seguras.</p>
            </div>
            <div class="page-actions">
                <a th:href="@{/usuarios}" class="btn btn-outline-primary">Volver a usuarios</a>
            </div>
        </section>

        <div class="card form-card">
            <div class="card-body">
                <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post" class="mt-3 form-grid">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div th:if="${formError}" class="alert alert-danger form-full-width" th:text="${formError}"></div>

                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                        <ul>
                            <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
                        </ul>
                    </div>

                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required />
                        <p class="error-message" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" th:field="*{email}" class="form-control" required autocomplete="email" title="Correo válido: usuario@dominio.com" />
                        <p class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                    </div>

                    <div class="form-group">
                        <label for="rol">Rol</label>
                        <select id="rol" th:field="*{rol}" class="form-select" required onchange="toggleResidentFields()">
                            <option value="">Seleccione un rol</option>
                            <option th:each="rolOption : ${roles}" th:value="${rolOption}" th:text="${rolOption}"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" th:field="*{password}" class="form-control" required minlength="8" autocomplete="new-password"
                               title="Mínimo 8 caracteres, al menos una mayúscula, una minúscula, un número y un símbolo" />
                        <small class="text-muted">La contraseña debe tener al menos 8 caracteres, mayúscula, minúscula, número y símbolo.</small>
                        <p class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                    </div>

                    <div class="form-group">
                        <label>Confirmar contraseña</label>
                        <input type="password" name="confirmPassword" class="form-control" required minlength="8" autocomplete="new-password" title="Repita la contraseña anterior" />
                    </div>

                    <div class="form-group resident-field">
                        <label>Documento</label>
                        <input id="documento" type="text" name="documento" th:value="${documento}" class="form-control" inputmode="numeric"
                               pattern="^[0-9]{6,12}$"
                               title="Solo números, entre 6 y 12 dígitos" />
                        <p class="error-message" th:if="${formError}" th:text="${formError}"></p>
                    </div>

                    <div class="form-group resident-field">
                        <label>Teléfono</label>
                        <input id="telefono" type="tel" name="telefono" th:value="${telefono}" class="form-control" inputmode="tel"
                               pattern="^\+?[0-9]{7,15}$"
                               title="Solo números, 7 a 15 dígitos, opcional prefijo +" />
                    </div>

                    <div class="form-group resident-field">
                        <label>Apartamento</label>
                        <input id="numeroApartamento" type="text" name="numeroApartamento" th:value="${numeroApartamento}" class="form-control" />
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-success">Crear usuario</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        function toggleResidentFields() {
            const isResident = document.getElementById('rol').value === 'RESIDENTE';
            document.querySelectorAll('.resident-field').forEach(function (field) {
                field.style.display = isResident ? '' : 'none';
                field.querySelectorAll('input').forEach(function (input) {
                    input.required = isResident;
                });
            });
        }
        document.addEventListener('DOMContentLoaded', toggleResidentFields);
    </script>
</html>
