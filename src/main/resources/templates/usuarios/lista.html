<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout/base :: page}">
   
       
    <div th:fragment="content" th:with="titulo='Usuarios | Urbelix'">

       <div th:if="${success}" class="alert alert-success">
        <span th:text="${success}"></span>
    </div>

    <div th:if="${error}" class="alert alert-danger">
        <span th:text="${error}"></span>
    </div>

        
        <!-- Page Header -->
        <div class="dashboard-welcome-header">
            <div class="welcome-content">
                <div class="welcome-avatar welcome-avatar--users">
                    <i class="bi bi-person-gear"></i>
                </div>
                <div class="welcome-text">
                    <h1 class="welcome-title">Gestión de Usuarios</h1>
                    <p class="welcome-subtitle">Administra las cuentas y roles del sistema</p>
                </div>
            </div>
            <div class="welcome-stats">
                <div class="stat-item">
                    <div class="stat-number" th:text="${usuarios.size()}">0</div>
                    <div class="stat-label">Total</div>
                </div>
            </div>
        </div>

        <!-- Create User Button -->
        <div class="page-actions mb-3">
            <a th:href="@{/usuarios/nuevo}" class="btn btn-primary btn-main-action">
                <i class="bi bi-person-plus"></i>
                Nuevo usuario
            </a>
        </div>
        <div class="page-filter mb-4"><input class="form-control" data-filter-search="usuarios" oninput="filterRows('usuarios')" placeholder="Buscar por nombre, correo o rol"></div>
        <div class="mb-4"><a th:href="@{/usuarios/excel/residentes}" class="btn btn-success"><i class="bi bi-file-earmark-excel me-2"></i>Exportar residentes</a></div>
        <!-- Users Table -->
        <div class="data-table-shell">
            <div class="table-responsive">
                <table class="table data-table align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="usuario : ${usuarios}" data-filter-row="usuarios">
                            <td th:text="${usuario.id}"></td>
                            <td th:text="${usuario.nombre}"></td>
                            <td th:text="${usuario.email}"></td>
                            <td>
                                <span th:if="${usuario.rol != null and usuario.rol.name() == 'ADMIN'}" class="role-badge role-badge--admin">Administrador</span>
                                <span th:if="${usuario.rol != null and usuario.rol.name() == 'RESIDENTE'}" class="role-badge role-badge--residente">Residente</span>
                                <span th:if="${usuario.rol != null and usuario.rol.name() == 'PORTERIA'}" class="role-badge role-badge--porteria">Portería</span>
                            </td>
                            <td>
                                <span th:if="${usuario.activo}" class="badge text-bg-success">Activo</span>
                                <span th:unless="${usuario.activo}" class="badge text-bg-secondary">Inactivo</span>
                            </td>
                            <td class="text-center">
                                <div class="data-table-actions d-inline-flex gap-2">
                                    <a class="btn btn-outline-warning btn-sm" th:href="@{/usuarios/editar/{id}(id=${usuario.id})}">
                                        <i class="bi bi-pencil"></i> Editar
                                    </a>
                                    <form class="d-inline" th:action="@{/usuarios/estado/{id}(id=${usuario.id})}" method="post" onsubmit="return confirm(this.dataset.confirmacion)" th:attr="data-confirmacion=${usuario.activo ? '¿Desactivar este usuario?' : '¿Activar este usuario?'}">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">
                                        <input type="hidden" name="activo" th:value="${!usuario.activo}">
                                        <button type="submit" class="btn btn-sm" th:classappend="${usuario.activo ? 'btn-outline-danger' : 'btn-outline-success'}">
                                            <i class="bi" th:classappend="${usuario.activo ? 'bi-person-slash' : 'bi-person-check'}"></i>
                                            <span th:text="${usuario.activo ? 'Desactivar' : 'Activar'}">Desactivar</span>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(usuarios)}">
                            <td colspan="6" class="table-empty">
                                <i class="bi bi-person-gear fs-1 d-block mb-2 text-muted"></i>
                                <br>
                                No hay usuarios registrados
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</html>
