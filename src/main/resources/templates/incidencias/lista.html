<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout/base :: page}">
<div th:fragment="content" th:with="titulo='Incidencias | Urbelix'">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="dashboard-welcome-header">
        <div class="welcome-content">
            <div class="welcome-avatar"><i class="bi bi-chat-square-text"></i></div>
            <div class="welcome-text">
                <h1 class="welcome-title">Incidencias y PQRS</h1>
                <p class="welcome-subtitle">Seguimiento de solicitudes de la comunidad.</p>
            </div>
        </div>
        <a sec:authorize="hasRole('RESIDENTE')" th:href="@{/incidencias/nueva}" class="btn btn-primary">Nueva incidencia</a>
    </div>
    <div class="row g-3 mb-4 toolbar-filter">
        <div class="col-md-8"><input class="form-control" data-filter-search="incidencias" oninput="filterRows('incidencias')" placeholder="Buscar por asunto, tipo o descripción"></div>
        <div class="col-md-4"><select class="form-select" data-filter-status="incidencias" onchange="filterRows('incidencias')"><option value="ALL">Todos los estados</option><option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}"></option></select></div>
    </div>
    <div class="timeline-container table-surface">
        <div class="table-responsive">
        <table class="table data-table data-table--dense align-middle mb-0">
            <thead><tr><th>Asunto</th><th>Tipo</th><th sec:authorize="hasRole('ADMIN')">Residente</th><th>Fecha</th><th>Estado</th><th>Evidencias</th><th sec:authorize="hasRole('ADMIN')">Gestionar</th></tr></thead>
            <tbody>
            <tr th:each="incidencia : ${incidencias}" data-filter-row="incidencias" th:attr="data-status=${incidencia.estado}">
                <td><strong th:text="${incidencia.asunto}"></strong><br><small class="text-muted" th:text="${incidencia.descripcion}"></small><div th:if="${incidencia.respuesta}" class="small mt-1"><strong>Respuesta:</strong> <span th:text="${incidencia.respuesta}"></span></div><div th:each="comentario : ${incidencia.comentarios}" class="small border-start ps-2 mt-2"><strong th:text="${comentario.autorNombre}">Autor</strong>: <span th:text="${comentario.contenido}">Comentario</span><br><span class="text-muted" th:text="${#temporals.format(comentario.creadoEn, 'dd/MM/yyyy HH:mm')}">Fecha</span></div><form sec:authorize="hasAnyRole('ADMIN','RESIDENTE')" th:action="@{/incidencias/{id}/comentarios(id=${incidencia.id})}" method="post" class="mt-2"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"><div class="input-group input-group-sm"><input name="contenido" class="form-control" maxlength="2000" placeholder="Agregar comentario" required><button class="btn btn-outline-secondary" type="submit">Enviar</button></div></form></td>
                <td th:text="${incidencia.tipo}"></td>
                <td sec:authorize="hasRole('ADMIN')" th:text="${incidencia.residente.nombre}"></td>
                <td th:text="${#temporals.format(incidencia.creadoEn, 'dd/MM/yyyy HH:mm')}"></td>
                <td><span class="badge text-bg-light" th:text="${incidencia.estado}"></span></td>
                <td><div th:if="${#lists.isEmpty(incidencia.adjuntos)}" class="small text-muted">Sin archivos</div><div th:each="adjunto : ${incidencia.adjuntos}" class="small mb-1"><i class="bi bi-paperclip me-1"></i><a th:href="@{/incidencias/{id}/adjuntos/{adjuntoId}(id=${incidencia.id}, adjuntoId=${adjunto.id})}" th:text="${adjunto.nombreOriginal}">evidencia.pdf</a></div><form sec:authorize="hasAnyRole('ADMIN','RESIDENTE')" th:action="@{/incidencias/{id}/adjuntos(id=${incidencia.id})}" method="post" enctype="multipart/form-data" class="mt-2"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"><input type="file" name="archivo" accept=".pdf,.png,.jpg,.jpeg" class="form-control form-control-sm" required><button class="btn btn-sm btn-outline-secondary mt-1" type="submit">Adjuntar</button><div class="form-text">PDF, PNG o JPG hasta 5 MB.</div></form></td>
                <td sec:authorize="hasRole('ADMIN')"><form th:action="@{/incidencias/{id}/estado(id=${incidencia.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"><select name="estado" class="form-select form-select-sm mb-1"><option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}" th:selected="${estado == incidencia.estado}"></option></select><input name="respuesta" class="form-control form-control-sm mb-1" placeholder="Respuesta (opcional)"><button class="btn btn-sm btn-outline-primary" type="submit">Guardar</button></form></td>
            </tr>
            <tr th:if="${#lists.isEmpty(incidencias)}"><td colspan="7" class="text-center text-muted py-5">No hay incidencias registradas.</td></tr>
            </tbody>
        </table>
        </div>
    </div>
</div>
</html>
