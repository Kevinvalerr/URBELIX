<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: page}">
<div th:fragment="content" th:with="titulo='Nueva incidencia | Urbelix'">
    <div class="dashboard-welcome-header" style="margin-bottom: 2rem; padding: 2rem;">
        <div class="welcome-content">
            <div class="welcome-avatar"><i class="bi bi-chat-square-text"></i></div>
            <div class="welcome-text">
                <h1 class="welcome-title">Reportar una incidencia</h1>
                <p class="welcome-subtitle">Cuéntanos qué sucede para que la administración pueda atenderlo.</p>
            </div>
        </div>
    </div>
    <div class="card form-card">
        <div class="card-body">
            <form th:action="@{/incidencias}" th:object="${incidencia}" method="post" class="form-grid">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
                </div>
                <div class="form-group">
                    <label for="asunto">Asunto</label>
                    <input id="asunto" type="text" th:field="*{asunto}" class="form-control" required maxlength="120">
                    <p class="error-message" th:if="${#fields.hasErrors('asunto')}" th:errors="*{asunto}"></p>
                </div>
                <div class="form-group">
                    <label for="tipo">Tipo</label>
                    <select id="tipo" th:field="*{tipo}" class="form-select">
                        <option value="GENERAL">General</option>
                        <option value="MANTENIMIENTO">Mantenimiento</option>
                        <option value="SEGURIDAD">Seguridad</option>
                        <option value="CONVIVENCIA">Convivencia</option>
                        <option value="OTRO">Otro</option>
                    </select>
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" th:field="*{descripcion}" class="form-control" rows="6" required maxlength="2000"></textarea>
                    <p class="error-message" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></p>
                </div>
                <div class="form-actions">
                    <a th:href="@{/incidencias}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Registrar incidencia</button>
                </div>
            </form>
        </div>
    </div>
</div>
</html>
