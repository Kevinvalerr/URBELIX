<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="layout/base :: page">
<div th:fragment="content">
    <div class="page-heading"><div><span class="eyebrow">URBELIX / Incidencias</span><h1 th:text="${incidencia.id == null ? 'Nueva incidencia' : 'Editar incidencia'}">Nueva incidencia</h1><p>Registra los detalles del caso para facilitar su atención.</p></div></div>
    <div th:if="${error}" class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span></div>
    <form th:action="@{/incidencias/guardar}" th:object="${incidencia}" method="post" class="incidencia-form"><input type="hidden" th:field="*{id}"/><input sec:authorize="!hasRole('ADMIN')" type="hidden" name="residenteId" th:value="${residenteId}"/><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:errors="*{global}"></div>
        <label for="titulo">Título <span class="required-mark">*</span></label><input id="titulo" th:field="*{titulo}" maxlength="150" required placeholder="Ej. Fuga de agua en la cocina"/><div class="field-error" th:errors="*{titulo}"></div>
        <label for="categoria">Categoría</label><input id="categoria" th:field="*{categoria}" maxlength="80" placeholder="Mantenimiento, convivencia, seguridad..."/>
        <div sec:authorize="hasRole('ADMIN')"><label for="residenteIdSelect">Residente <span class="required-mark">*</span></label><select id="residenteIdSelect" name="residenteId" required><option value="">Selecciona un residente</option><option th:each="r : ${residentes}" th:value="${r.id}" th:text="${r.nombre + ' - ' + r.documento}" th:selected="${residenteId == r.id}"></option></select></div>
        <label for="apartamentoId">Apartamento relacionado</label><select id="apartamentoId" name="apartamentoId"><option value="">Apartamento principal</option><option th:each="a : ${apartamentos}" th:value="${a.id}" th:text="${a.torre + ' - ' + a.numero}"></option></select>
        <label for="prioridad">Prioridad <span class="required-mark">*</span></label><select id="prioridad" th:field="*{prioridad}" required><option th:each="p : ${prioridades}" th:value="${p}" th:text="${p}"></option></select>
        <label for="descripcion">Descripción <span class="required-mark">*</span></label><textarea id="descripcion" th:field="*{descripcion}" maxlength="2000" rows="8" required placeholder="Describe qué ocurrió, dónde y desde cuándo..."></textarea><div class="field-error" th:errors="*{descripcion}"></div>
        <div class="form-actions"><a th:href="@{/incidencias}" class="btn btn-light">Cancelar</a><button class="btn btn-primary" type="submit"><i class="bi bi-send"></i> Registrar incidencia</button></div>
    </form>
</div></html>
