<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña | Urbelix</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="auth-page">
    <section class="auth-card" aria-labelledby="reset-heading">
        <div class="brand-mark" aria-hidden="true">U</div>
        <h1 id="reset-heading" class="auth-heading">Restablecer contraseña</h1>

        <div th:if="${!tokenValido}" class="alert alert-danger">
            Este enlace no es válido o ya expiró. Solicita uno nuevo desde la recuperación de contraseña.
        </div>

        <form th:if="${tokenValido}" th:action="@{/reset-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">
            <input type="hidden" name="token" th:value="${token}">
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div class="form-group">
                <label for="password">Nueva contraseña</label>
                <input id="password" name="password" type="password" class="form-control" required minlength="8"
                       pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
                       title="Mínimo 8 caracteres, una mayúscula, una minúscula, un número y un símbolo" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirmar contraseña</label>
                <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" required minlength="8" autocomplete="new-password">
            </div>
            <button type="submit" class="primary-button">Guardar contraseña</button>
        </form>

        <div class="link-group"><a th:href="@{/login}">Volver al login</a></div>
    </section>
</main>
</body>
</html>
