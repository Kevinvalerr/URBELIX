<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Urbelix</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="auth-page">
    <section class="auth-card" aria-labelledby="register-heading">
        <div class="brand-mark" aria-hidden="true">U</div>
        <div class="mb-4">
            <h1 id="register-heading" class="auth-heading">Crear cuenta</h1>
            <p class="auth-subtitle">Registra tus datos para solicitar acceso residencial.</p>
        </div>
        <form th:action="@{/register}" th:object="${usuario}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
            </div>
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input id="nombre" th:field="*{nombre}" class="form-control" required>
                <p class="error-message" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>
            </div>
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input id="email" type="email" th:field="*{email}" class="form-control" required autocomplete="email">
                <p class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input id="password" type="password" th:field="*{password}" class="form-control" required minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}" autocomplete="new-password" title="Mínimo 8 caracteres, una mayúscula, una minúscula, un número y un símbolo">
                <p class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirmar contraseña</label>
                <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" required minlength="8" autocomplete="new-password" title="Repite la contraseña">
            </div>
            <div class="form-group">
                <label for="documento">Documento</label>
                <input id="documento" name="documento" th:value="${documento}" class="form-control" required pattern="[0-9]{8,}">
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input id="telefono" name="telefono" th:value="${telefono}" class="form-control" required pattern="[0-9]{10,}">
            </div>
            <div class="form-group">
                <label for="numeroApartamento">Apartamento</label>
                <input id="numeroApartamento" name="numeroApartamento" th:value="${numeroApartamento}" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="codigoRegistro">Código de registro residencial</label>
                <input id="codigoRegistro" name="codigoRegistro" th:value="${codigoRegistro}" class="form-control" required autocomplete="off">
                <small class="text-muted">Solicítalo a la administración de tu conjunto.</small>
            </div>
            <button type="submit" class="primary-button">Crear cuenta</button>
        </form>
        <div class="link-group">¿Ya tienes cuenta? <a th:href="@{/login}">Iniciar sesión</a></div>
    </section>
</main>
</body>
</html>
