<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña | URBELIX</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
<main class="auth-page">
    <section class="auth-card password-card" aria-labelledby="password-heading">
        <div class="brand-mark" aria-hidden="true"><i class="bi bi-shield-lock-fill"></i></div>
        <span class="eyebrow">Seguridad de la cuenta</span>
        <h1 id="password-heading" class="auth-heading">Cambia tu contraseña</h1>
        <p class="auth-subtitle">Debes actualizar la contraseña temporal para continuar.</p>
        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
        <form th:action="@{/cuenta/cambiar-password}" method="post" id="passwordForm">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="password-field">
                <label for="passwordActual" class="form-label">Contraseña temporal actual</label>
                <div class="password-input-wrap"><i class="bi bi-key password-field-icon" aria-hidden="true"></i><input id="passwordActual" name="passwordActual" type="password" class="form-control" required autocomplete="current-password"><button type="button" class="password-toggle" data-target="passwordActual" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button></div>
            </div>
            <div class="password-field">
                <label for="passwordNueva" class="form-label">Nueva contraseña</label>
                <div class="password-input-wrap"><i class="bi bi-lock password-field-icon" aria-hidden="true"></i><input id="passwordNueva" name="passwordNueva" type="password" class="form-control" minlength="8" required autocomplete="new-password"><button type="button" class="password-toggle" data-target="passwordNueva" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button></div>
            </div>
            <div class="password-requirements" aria-live="polite">
                <p class="requirements-title">Tu nueva contraseña debe incluir:</p>
                <div class="requirement" data-rule="length"><i class="bi bi-circle"></i><span>Mínimo 8 caracteres</span></div>
                <div class="requirement" data-rule="upper"><i class="bi bi-circle"></i><span>Al menos una mayúscula</span></div>
                <div class="requirement" data-rule="lower"><i class="bi bi-circle"></i><span>Al menos una minúscula</span></div>
                <div class="requirement" data-rule="number"><i class="bi bi-circle"></i><span>Al menos un número</span></div>
                <div class="requirement" data-rule="special"><i class="bi bi-circle"></i><span>Al menos un carácter especial</span></div>
            </div>
            <div class="password-field">
                <label for="confirmarPassword" class="form-label">Confirmar nueva contraseña</label>
                <div class="password-input-wrap"><i class="bi bi-shield-check password-field-icon" aria-hidden="true"></i><input id="confirmarPassword" name="confirmarPassword" type="password" class="form-control" minlength="8" required autocomplete="new-password"><button type="button" class="password-toggle" data-target="confirmarPassword" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button></div>
                <p id="matchMessage" class="password-match" aria-live="polite"></p>
            </div>
            <button type="submit" class="primary-button password-submit"><i class="bi bi-check2-circle me-2"></i>Actualizar contraseña</button>
        </form>
        <p class="security-note"><i class="bi bi-shield-check me-2"></i>Tu contraseña se protege de forma segura.</p>
    </section>
</main>
<script>
const newPassword=document.getElementById('passwordNueva'), confirmation=document.getElementById('confirmarPassword'), matchMessage=document.getElementById('matchMessage');
const rules={length:v=>v.length>=8,upper:v=>/[A-Z]/.test(v),lower:v=>/[a-z]/.test(v),number:v=>/\d/.test(v),special:v=>/[^A-Za-z0-9]/.test(v)};
function updateRequirements(){const value=newPassword.value;document.querySelectorAll('.requirement').forEach(item=>{const valid=rules[item.dataset.rule](value);item.classList.toggle('is-valid',valid);item.querySelector('i').className=valid?'bi bi-check-circle-fill':'bi bi-circle';});}
function updateMatch(){if(!confirmation.value){matchMessage.textContent='';return;}const valid=newPassword.value===confirmation.value;matchMessage.textContent=valid?'Las contraseñas coinciden.':'Las contraseñas no coinciden.';matchMessage.className=valid?'password-match is-valid':'password-match is-invalid';}
newPassword.addEventListener('input',()=>{updateRequirements();updateMatch();});confirmation.addEventListener('input',updateMatch);
document.querySelectorAll('.password-toggle').forEach(button=>button.addEventListener('click',()=>{const input=document.getElementById(button.dataset.target),icon=button.querySelector('i'),visible=input.type==='text';input.type=visible?'password':'text';icon.className=visible?'bi bi-eye':'bi bi-eye-slash';}));
</script>
</body>
</html>
