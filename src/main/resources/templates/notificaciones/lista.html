<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: page}">
<div th:fragment="content" th:with="titulo='Notificaciones | Urbelix'">
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <section class="page-top-section mb-4"><div><h1>Notificaciones</h1><p class="text-muted">Seguimiento de novedades importantes de tu cuenta.</p></div></section>
    <div class="row g-3">
        <article class="col-12" th:each="notificacion : ${notificaciones}">
            <div class="card" th:classappend="${!notificacion.leida ? 'border-primary' : ''}"><div class="card-body d-flex justify-content-between gap-3 align-items-start">
                <div><span th:if="${!notificacion.leida}" class="badge text-bg-primary mb-2">Nueva</span><h2 class="h5" th:text="${notificacion.titulo}">Notificación</h2><p class="mb-1" th:text="${notificacion.mensaje}">Mensaje</p><small class="text-muted" th:text="${#temporals.format(notificacion.creadaEn, 'dd/MM/yyyy HH:mm')}">Fecha</small></div>
                <div class="text-end"><a th:if="${notificacion.enlace != null}" th:href="${notificacion.enlace}" class="btn btn-sm btn-outline-primary mb-2">Ver detalle</a><form th:if="${!notificacion.leida}" th:action="@{/notificaciones/{id}/leer(id=${notificacion.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"><button class="btn btn-sm btn-outline-secondary" type="submit">Marcar leída</button></form></div>
            </div></div>
        </article>
        <div class="col-12" th:if="${#lists.isEmpty(notificaciones)}"><div class="text-center text-muted py-5">No tienes notificaciones nuevas.</div></div>
    </div>
</div>
</html>
