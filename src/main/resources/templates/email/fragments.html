<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
<div th:fragment="content">
    <h1 th:text="${titulo}" style="margin:0 0 16px;color:#163b65;font-size:24px;line-height:30px;">Notificación de Urbelix</h1>
    <p th:if="${preheader}" th:text="${preheader}" style="margin:0 0 18px;color:#526273;font-size:15px;line-height:24px;">Información importante de tu residencia.</p>
    <p th:if="${mensaje}" th:text="${mensaje}" style="margin:0 0 22px;color:#243447;font-size:15px;line-height:24px;white-space:pre-line;">Consulta la información en Urbelix.</p>
    <table th:if="${detalleEtiqueta}" role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 22px;background:#f4f7fb;border-left:4px solid #2a9d8f;">
        <tr><td style="padding:14px 16px;"><div th:text="${detalleEtiqueta}" style="color:#718096;font-size:12px;text-transform:uppercase;">Detalle</div><strong th:text="${detalle}" style="display:block;margin-top:4px;color:#163b65;font-size:18px;">-</strong></td></tr>
    </table>
    <p th:if="${enlace}" style="margin:0 0 24px;"><a th:href="${enlace}" th:text="${textoEnlace}" style="display:inline-block;background:#2a9d8f;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:5px;font-weight:bold;font-size:14px;">Ver en Urbelix</a></p>
    <p th:if="${expiracion}" th:text="${expiracion}" style="margin:0;color:#718096;font-size:13px;line-height:20px;">-</p>
</div>
</body>
</html>
