<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout/base :: page}">

<div th:if="${success}" class="alert alert-success">
    <i class="bi bi-check-circle-fill me-2"></i>
    <span th:text="${success}"></span>
</div>

    <div th:fragment="content" th:with="titulo='Reservas | Urbelix'">
        <!-- Page Header -->
        <div class="dashboard-welcome-header">
            <div class="welcome-content">
                <div class="welcome-avatar welcome-avatar--reservations">
                    <i class="bi bi-calendar-check"></i>
                </div>
                <div class="welcome-text">
                    <h1 class="welcome-title">Gestión de Reservas</h1>
                    <p class="welcome-subtitle">Administra las reservas de áreas comunes</p>
                </div>
            </div>
            <div class="welcome-stats">
                <div class="stat-item">
                    <div class="stat-number" th:text="${reservas.size()}">0</div>
                    <div class="stat-label">Total</div>
                </div>
            </div>
        </div>

        <!-- Create Reservation Button -->
        <div sec:authorize="hasRole('RESIDENTE')" class="page-actions mb-4">
            <a th:href="@{/reservas/nueva}" class="btn btn-primary btn-main-action">
                <i class="bi bi-plus-circle"></i>
                Crear Nueva Reserva
            </a>
        </div>
        <div class="row g-3 mb-4 toolbar-filter"><div class="col-md-8"><input class="form-control" data-filter-search="reservas" oninput="filterRows('reservas')" placeholder="Buscar por residente, apartamento o área"></div><div class="col-md-4"><select class="form-select" data-filter-status="reservas" onchange="filterRows('reservas')"><option value="ALL">Todos los estados</option><option value="PENDIENTE">Pendientes</option><option value="APROBADA">Aprobadas</option><option value="RECHAZADA">Rechazadas</option></select></div></div>

        <!-- Reservations Table -->
        <div class="timeline-container table-surface">
            <div class="table-responsive">
                <table class="table data-table data-table--dense align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Solicitante</th>
                            <th>Apartamento</th>
                            <th>Área</th>
                            <th>Fecha y hora</th>
                            <th>Observaciones</th>
                            <th sec:authorize="hasRole('ADMIN')" class="text-center">Acciones</th>
                            <th class="text-center">Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="reserva : ${reservas}" data-filter-row="reservas" th:attr="data-status=${reserva.estado != null ? reserva.estado.name() : 'SIN_ESTADO'}">
                            <td th:text="${reserva.residente != null ? reserva.residente.nombre : 'N/A'}"></td>
                            <td th:text="${reserva.apartamento != null ? reserva.apartamento.numero : 'Sin asignar'}"></td>
                            <td>
                                <span th:if="${reserva.tipoEspacio != null and reserva.tipoEspacio.name() == 'SALON_SOCIAL'}" class="space-badge space-badge--blue">Salón social</span>
                                <span th:if="${reserva.tipoEspacio == 'PISCINA'}" class="space-badge space-badge--cyan">Piscina</span>
                                <span th:if="${reserva.tipoEspacio == 'GIMNASIO'}" class="space-badge space-badge--sky">Gimnasio</span>
                                <span th:if="${reserva.tipoEspacio == null or (reserva.tipoEspacio.name() != 'SALON_SOCIAL' and reserva.tipoEspacio.name() != 'PISCINA' and reserva.tipoEspacio.name() != 'GIMNASIO')}" class="space-badge space-badge--neutral" th:text="${reserva.tipoEspacio != null ? reserva.tipoEspacio : 'Sin espacio'}"></span>
                            </td>
                            <td th:text="${#temporals.format(reserva.fechaInicio, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>
                                <small class="reservation-note" th:text="${reserva.observaciones}"></small>
                            </td>
                            <td sec:authorize="hasRole('ADMIN')" class="text-center">
                                <div th:if="${reserva.estado != null and reserva.estado.name() == 'PENDIENTE'}" class="reservation-actions">
                                    <form method="post">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <textarea name="comentario" class="form-control form-control-sm" placeholder="Mensaje al residente..." rows="2"></textarea>
                                        <div class="reservation-action-buttons">
                                            <button type="submit" class="btn btn-sm btn-outline-success" th:attr="formaction=@{/reservas/aprobar/{id}(id=${reserva.id})}">
                                                <i class="bi bi-check-circle"></i> Aprobar
                                            </button>
                                            <button type="submit" class="btn btn-sm btn-outline-danger" th:attr="formaction=@{/reservas/rechazar/{id}(id=${reserva.id})}">
                                                <i class="bi bi-x-circle"></i> Rechazar
                                            </button>
                                        </div>
                                    </form>
                                </div>
                                <div th:if="${reserva.estado == null or reserva.estado.name() != 'PENDIENTE'}" class="text-muted small fst-italic">
                                    Procesada
                                </div>
                            </td>
                            <td class="text-center">
                                <span th:if="${reserva.estado != null and reserva.estado.name() == 'PENDIENTE'}" class="status-badge status-badge--pending">Pendiente</span>
                                <span th:if="${reserva.estado != null and reserva.estado.name() == 'APROBADA'}" class="status-badge status-badge--approved">Aprobada</span>
                                <span th:if="${reserva.estado != null and reserva.estado.name() == 'RECHAZADA'}" class="status-badge status-badge--rejected">Rechazada</span>
                                <span th:if="${reserva.estado == null}" class="text-muted">Sin estado</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(reservas)}">
                            <td colspan="7" class="table-empty">
                                <i class="bi bi-calendar-check fs-1 d-block mb-2 text-muted"></i>
                                <br>
                                No hay reservas registradas
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</html>
