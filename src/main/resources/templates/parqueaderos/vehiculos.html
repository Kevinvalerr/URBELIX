<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout/base :: page}">
<div th:fragment="content" th:with="titulo='Vehículos | Urbelix'">
    <section class="page-top-section mb-4"><div><h1>Vehículos registrados</h1><p class="text-muted">Consulta y actualiza los vehículos de los residentes para la operación de portería.</p></div><div sec:authorize="hasRole('PORTERIA')"><a th:href="@{/porteria/parqueaderos/vehiculos/nuevo}" class="btn btn-primary"><i class="bi bi-plus-circle me-2"></i>Registrar vehículo</a></div></section>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="card"><div class="card-body"><div class="mb-3"><input class="form-control" data-filter-search="vehiculos" oninput="filterRows('vehiculos')" placeholder="Buscar por placa, residente, marca o color"></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Placa</th><th>Tipo</th><th>Marca / modelo</th><th>Color</th><th>Residente</th><th>Parqueadero</th><th sec:authorize="hasRole('PORTERIA')">Acciones</th></tr></thead><tbody>
    <tr th:each="vehiculo : ${vehiculos}" data-filter-row="vehiculos"><td th:text="${vehiculo.placa}">ABC123</td><td th:text="${vehiculo.tipo}">CARRO</td><td th:text="${vehiculo.marca + ' ' + (vehiculo.modelo ?: '')}">Marca Modelo</td><td th:text="${vehiculo.color ?: 'Sin definir'}">Blanco</td><td th:text="${vehiculo.residente.nombre}">Residente</td><td th:text="${vehiculo.parqueadero != null ? vehiculo.parqueadero.numero : 'Sin asignar'}">Sin asignar</td><td sec:authorize="hasRole('PORTERIA')"><a th:href="@{/porteria/parqueaderos/vehiculos/editar/{id}(id=${vehiculo.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i> Editar</a><form class="d-inline" th:action="@{/porteria/parqueaderos/vehiculos/eliminar/{id}(id=${vehiculo.id})}" method="post" sec:authorize="hasRole('PORTERIA')"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"><button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button></form></td></tr>
    <tr th:if="${#lists.isEmpty(vehiculos)}"><td colspan="7" class="text-center text-muted py-4">No hay vehículos registrados.</td></tr></tbody></table></div></div></div>
</div>
</html>
