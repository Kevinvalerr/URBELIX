<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: page}">
<div th:fragment="content" th:with="titulo='Historial de movimientos | Urbelix'"><section class="page-top-section mb-4"><div><h1>Historial de movimientos</h1><p class="text-muted">Consulta los ingresos y salidas registrados.</p></div></section><div class="card mb-4"><div class="card-body"><form th:action="@{/porteria/parqueaderos/historial}" method="get" class="row g-2 align-items-end"><div class="col-md-2"><label for="placa">Placa</label><input id="placa" name="placa" th:value="${placa}" class="form-control"></div><div class="col-md-2"><label for="tipo">Tipo</label><select id="tipo" name="tipo" class="form-select"><option value="">Todos</option><option th:each="valor : ${tipos}" th:value="${valor}" th:text="${valor}" th:selected="${valor == tipoSeleccionado}"></option></select></div><div class="col-md-2"><label for="parqueadero">Parqueadero</label><input id="parqueadero" name="parqueadero" th:value="${parqueadero}" class="form-control"></div><div class="col-md-2"><label for="estado">Estado</label><select id="estado" name="estado" class="form-select"><option value="">Todos</option><option th:each="valor : ${estadosMovimiento}" th:value="${valor}" th:text="${valor}" th:selected="${valor == estadoSeleccionado}"></option></select></div><div class="col-md-2"><label for="fecha">Fecha</label><input id="fecha" name="fecha" type="date" th:value="${fecha}" class="form-control"></div><div class="col-md-2"><button class="btn btn-primary" type="submit"><i class="bi bi-search me-2"></i>Filtrar</button></div></form></div></div><div class="card"><div class="card-body"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Placa</th><th>Tipo</th><th>Residente</th><th>Parqueadero</th><th>Ingreso</th><th>Salida</th><th>Estado</th></tr></thead><tbody><tr th:each="movimiento : ${movimientos}"><td th:text="${movimiento.vehiculo.placa}">ABC123</td><td th:text="${movimiento.vehiculo.tipo}">CARRO</td><td th:text="${movimiento.vehiculo.residente.nombre}">Residente</td><td th:text="${movimiento.parqueadero.numero}">P-01</td><td th:text="${#temporals.format(movimiento.fechaHoraIngreso, 'dd/MM/yyyy HH:mm')}">26/08/2026 08:00</td><td th:text="${movimiento.fechaHoraSalida != null ? #temporals.format(movimiento.fechaHoraSalida, 'dd/MM/yyyy HH:mm') : '-'}">-</td><td><span class="badge text-bg-success" th:if="${movimiento.estado.name() == 'DENTRO'}">Dentro</span><span class="badge text-bg-secondary" th:if="${movimiento.estado.name() == 'SALIO'}">Salió</span></td></tr><tr th:if="${#lists.isEmpty(movimientos)}"><td colspan="7" class="text-center text-muted py-4">No hay movimientos registrados.</td></tr></tbody></table></div></div></div></div>
</html>
