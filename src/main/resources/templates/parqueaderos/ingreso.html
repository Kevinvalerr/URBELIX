<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: page}">
<div th:fragment="content" th:with="titulo='Registrar ingreso | Urbelix'"><section class="page-top-section mb-4"><div><h1>Registrar ingreso</h1><p class="text-muted">Selecciona el vehículo y el parqueadero utilizado.</p></div></section><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="card form-card"><div class="card-body"><form th:action="@{/porteria/parqueaderos/ingreso}" method="post" class="form-grid"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"><div class="form-group"><label for="vehiculoId">Vehículo</label><select id="vehiculoId" name="vehiculoId" class="form-select" required><option value="">Seleccione</option><option th:each="vehiculo : ${vehiculos}" th:value="${vehiculo.id}" th:text="${vehiculo.placa + ' - ' + vehiculo.residente.nombre}"></option></select></div><div class="form-group"><label for="parqueaderoId">Parqueadero</label><select id="parqueaderoId" name="parqueaderoId" class="form-select" required><option value="">Seleccione</option><option th:each="parqueadero : ${parqueaderos}" th:if="${parqueadero.estado.name() == 'DISPONIBLE' or parqueadero.estado.name() == 'ASIGNADO'}" th:value="${parqueadero.id}" th:text="${parqueadero.numero + ' - ' + parqueadero.tipo}"></option></select></div><div class="form-actions"><a th:href="@{/porteria/parqueaderos}" class="btn btn-outline-secondary">Cancelar</a><button class="btn btn-primary" type="submit"><i class="bi bi-box-arrow-in-right me-2"></i>Registrar ingreso</button></div></form></div></div></div>
</html>
