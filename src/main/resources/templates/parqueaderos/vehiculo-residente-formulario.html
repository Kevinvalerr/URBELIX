<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: page}">
<div th:fragment="content">
    <section class="page-top-section mb-4"><div><h1 th:text="${titulo}">Registrar vehículo</h1><p class="text-muted">Los vehículos quedan asociados a tu cuenta residencial.</p></div></section>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="card form-card"><div class="card-body"><form th:action="@{/parqueaderos/mis-vehiculos/guardar}" th:object="${vehiculo}" method="post" class="form-grid"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">
        <input type="hidden" th:field="*{id}">
        <div class="form-group"><label for="placa">Placa</label><input id="placa" th:field="*{placa}" class="form-control" maxlength="10" required pattern="[A-Za-z0-9-]{3,10}"></div>
        <div class="form-group"><label for="tipo">Tipo</label><select id="tipo" th:field="*{tipo}" class="form-select" required><option value="">Seleccione</option><option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo}"></option></select></div>
        <div class="form-group"><label for="marca">Marca</label><input id="marca" th:field="*{marca}" class="form-control" maxlength="60"></div>
        <div class="form-group"><label for="modelo">Modelo</label><input id="modelo" th:field="*{modelo}" class="form-control" maxlength="30"></div>
        <div class="form-group"><label for="color">Color</label><input id="color" th:field="*{color}" class="form-control" maxlength="30"></div>
        <div class="form-actions"><a th:href="@{/parqueaderos/mis-vehiculos}" class="btn btn-outline-secondary">Cancelar</a><button type="submit" class="btn btn-primary"><i class="bi bi-save me-2"></i>Guardar</button></div>
    </form></div></div>
</div>
</html>
