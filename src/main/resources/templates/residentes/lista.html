<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout/base :: page}">
    <div th:fragment="content" th:with="titulo='Residentes | Urbelix'">
        <!-- Page Header -->
        <div class="dashboard-welcome-header">
            <div class="welcome-content">
                <div class="welcome-avatar welcome-avatar--residents">
                    <i class="bi bi-people"></i>
                </div>
                <div class="welcome-text">
                    <h1 class="welcome-title">Gestión de Residentes</h1>
                    <p class="welcome-subtitle">Administra todos los residentes del condominio</p>
                </div>
            </div>
            <div class="welcome-stats">
                <div class="stat-item">
                    <div class="stat-number" th:text="${residentes.size()}">0</div>
                    <div class="stat-label">Total</div>
                </div>
            </div>
        </div>

        <div class="page-actions mb-4">
            <a th:href="@{/residentes/nuevo}" class="btn btn-primary btn-main-action"><i class="bi bi-person-plus me-2"></i>Nuevo residente</a>
            <a th:href="@{/residentes/importar}" class="btn btn-outline-primary"><i class="bi bi-file-earmark-spreadsheet me-2"></i>Importar desde Excel</a>
        </div>
        <div class="page-filter mb-4"><input class="form-control" data-filter-search="residentes" oninput="filterRows('residentes')" placeholder="Buscar por nombre, documento, teléfono o apartamento"></div>

        <!-- Residents Table -->
      
        <!-- Residents Table -->
        <div class="data-table-shell">
            <div class="table-responsive">
                <table class="table data-table align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Documento</th>
                            <th>Teléfono</th>
                            <th>Apartamento</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="residente : ${residentes}" data-filter-row="residentes">
                            <td th:text="${residente.id}"></td>
                            <td th:text="${residente.nombre}"></td>
                            <td th:text="${residente.documento}"></td>
                            <td th:text="${residente.telefono}"></td>
                            <td th:text="${residente.apartamento != null ? residente.apartamento.numero : 'Sin asignar'}"></td>
                            <td class="text-center">
                                <div class="data-table-actions d-inline-flex gap-2">
                                    <a th:href="@{/residentes/editar/{id}(id=${residente.id})}" class="btn btn-sm btn-outline-warning">
                                        <i class="bi bi-pencil"></i> Editar
                                    </a>
                                    <form th:action="@{/residentes/eliminar/{id}(id=${residente.id})}" method="post" onsubmit="return confirm('¿Estás seguro de que quieres eliminar este residente?')">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Eliminar</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(residentes)}">
                            <td colspan="6" class="table-empty">
                                <i class="bi bi-people fs-1 d-block mb-2 text-muted"></i>
                                <br>
                                No hay residentes registrados
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</html>
