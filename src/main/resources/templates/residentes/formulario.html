<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: page}">
    <div th:fragment="content" th:with="titulo=${titulo}">
        <section class="page-top-section mb-4">
            <div>
                <h1 th:text="${isNew} ? 'Registrar residente' : 'Editar residente'">Registrar residente</h1>
                <p class="text-muted">Completa los datos del perfil y asígnalo a un apartamento.</p>
            </div>
        </section>

        <div class="form-card">
            <form th:action="@{/residentes/guardar}" th:object="${residente}" method="post" class="form-grid js-validated-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">
                <input type="hidden" th:field="*{id}" />
                <div th:if="${formError}" class="alert alert-danger form-group-full" th:text="${formError}"></div>
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" type="text" th:field="*{nombre}" placeholder="Ingrese nombre completo" required />
                    <p class="error-message"></p>
                </div>
                <div class="form-group">
                    <label for="documento">Documento</label>
                    <input id="documento" type="text" th:field="*{documento}" placeholder="Número de documento" required pattern="[0-9]{8,}" title="Solo números, mínimo 8 dígitos" inputmode="numeric" />
                    <p class="form-error error-message" th:if="${#fields.hasErrors('documento')}" th:errors="*{documento}"></p>
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input id="telefono" type="tel" th:field="*{telefono}" placeholder="Ej. 3101234567" required pattern="[0-9]{10,}" title="Solo números, mínimo 10 dígitos" inputmode="numeric" />
                    <p class="form-error error-message" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></p>
                </div>
                <div class="form-group">
                    <label for="apartamentoId">Apartamento</label>
                    <select id="apartamentoId" name="apartamentoId" required>
                        <option value="">Seleccione un apartamento</option>
                        <option th:each="ap : ${apartamentos}"
                                th:value="${ap.id}"
                                th:text="${ap.numero}"
                                th:selected="${residente.apartamento != null and residente.apartamento.id == ap.id}">
                        </option>
                    </select>
                </div>
                <div th:if="${isNew}" class="form-group-full border-top pt-3 mt-2">
                    <h2 class="h5">Cuenta de acceso</h2>
                    <p class="text-muted">El residente usará este correo para iniciar sesión.</p>
                </div>
                <div th:if="${isNew}" class="form-group">
                    <label for="usuarioEmail">Correo electrónico</label>
                    <input id="usuarioEmail" type="email" th:field="*{usuario.email}" class="form-control" required autocomplete="email" />
                    <p class="form-error error-message" th:if="${#fields.hasErrors('usuario.email')}" th:errors="*{usuario.email}"></p>
                </div>
                <div th:if="${isNew}" class="form-group">
                    <label for="usuarioPassword">Contraseña temporal</label>
                    <input id="usuarioPassword" type="password" th:field="*{usuario.password}" class="form-control" required minlength="8"
                           pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
                           title="Mínimo 8 caracteres, una mayúscula, una minúscula, un número y un símbolo" autocomplete="new-password" />
                    <p class="form-error error-message" th:if="${#fields.hasErrors('usuario.password')}" th:errors="*{usuario.password}"></p>
                </div>
                <div th:if="${isNew}" class="form-group">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input id="confirmPassword" type="password" name="confirmPassword" class="form-control" required minlength="8" autocomplete="new-password" />
                </div>
                <div class="form-actions">
                    <a th:href="@{/residentes}" class="btn btn-outline-primary">Volver a residentes</a>
                    <button type="submit" class="btn btn-primary btn-main-action">
                        <i class="bi bi-save me-2"></i>Guardar residente
                    </button>
                </div>
            </form>
        </div>
    </div>
</html>
